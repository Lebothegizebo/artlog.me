<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=3"> <!-- Bump this version number every time you change style.js -->
    <script src="script.js?v=3"></script> <!-- Bump this version number every time you change script.js -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>


<body class="diary-page">

<div id="bootScreen">
<div class="boot-terminal">
    <p>> SYSTEM STANDBY...</p>
    <p>> AWAITING USER AUTHENTICATION</p>
    <p class="blink">> CLICK TO INITIALIZE CONNECTION_</p>
</div>
</div>

<nav class="navbar">
    <a href="index.html" data-transition>home</a>
    <a href="music.html" data-transition>music</a>
    <a href="art.html" data-transition>art</a>
    <a href="diary.html" data-transition>diary</a>
</nav>




<div class="container">
    
    <section class="diary-sidebar box">
        <h2>//DIARY_LOGS</h2>
        <div class="search-container">
            <input type="text" id="diarySearch" placeholder="SEARCH DATE [DD-MM-YYYY] OR COLOR..." class="terminal-input">
        </div>
        <div id="diaryListContainer" class="music-scroll"></div>
    </section>

    <section class="diary-viewer box">
        <h2>//TERMINAL_OUTPUT</h2>
        <div id="diaryTerminal" class="log-text">
            <div class="log-entry system">> AWAITING LOG SELECTION...</div>
        </div>
    </section>

    <div class="diary-panel box">
        <h2>//SYSTEM_LOG</h2>
        <div id="logContainer"></div>
    </div>

</div>

<div id="transitionOverlay">
    <div class="transition-text">switching module...</div>
</div>


<audio id="bgm-player" loop src="BGM.mp3"></audio>

</body>
</html>
