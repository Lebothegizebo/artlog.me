<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/lainavian/style.css?v=3"> <!-- Bump this version number every time you change style.js -->

    <style>
        body {
            background-image: url('bg.jpg');
        }
    </style>
</head>
<script src="js/script.js?v=3"></script> <!-- Bump this version number every time you change script.js -->

<body class="music-page">

<!-- NAVBAR -->
<nav class="navbar">
    <a href="beta_index.html" data-transition>home</a>
    <a href="beta_music.html" data-transition>music</a>
    <a href="beta_art.html" data-transition>art</a>
    <a href="beta_diary.html" data-transition>diary</a>
</nav>


<div class="container">
    <!-- LEFT: MUSIC ARCHIVE -->
    <section class="box music">
        <h2>
            //MUSIC_ARCHIVE
        </h2>
        
        <div id="musicContainer" class="music-scroll"> </div>

        <!-- SINGLE AUDIO ELEMENT (MUST MATCH HOME PAGE) -->

    </section>

    <!-- TOP RIGHT: NOW PLAYING -->

    <div class="now-playing-panel box">

        <img id="nowCover" class="now-cover" src="assets/images/background/lainavian/bg.jpg" alt="cover">
        <div class="now-meta">
        <div id="nowAlbum">---</div>
        </div>

        <!-- PLAYER -->
        <div class="now-meta">
            <div class="now-playing">
                now playing: <span id="nowPlayingText">---</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <div class="player-controls">

    <input
        type="range"
        id="volumeSlider"
        class="volume-slider"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
    >

    <div class="time-display">
        <span id="currentTime">0:00</span>
        /
        <span id="duration">0:00</span>
    </div>

</div>
        </div>

    
    </div>


    <!-- BOTTOM RIGHT: SYSTEM LOG -->
    <div class="log-panel box">

        <h2>//SYSTEM_LOG</h2>

        <div id="logContainer"></div>

    </div>

</div>

<!-- AUDIO -->
<audio id="player"></audio>

<div id="transitionOverlay">
    <div class="transition-text">switching module...</div>
</div>

</body>
</html>
